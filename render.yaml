services:
  - type: web
    name: nepal-flood-vibration-monitor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_KEY
        sync: false
      - key: WARNING_LEVEL_CM
        value: "4"
      - key: DANGER_LEVEL_CM
        value: "6"
